[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  included_files = ["tools/site-customizer-cloud.html"]

[[redirects]]
  from = "/studio"
  to = "/.netlify/functions/studio?action=editor"
  status = 200
  force = true

[[redirects]]
  from = "/studio/"
  to = "/.netlify/functions/studio?action=editor"
  status = 200
  force = true

[[redirects]]
  from = "/api/studio"
  to = "/.netlify/functions/studio"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/callback"
  to = "/.netlify/functions/auth-callback"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200
  force = true
